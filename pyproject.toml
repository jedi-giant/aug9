[project]
name = "aug9"
version = "0.1.0"
description = "Open-source Singapore personal agent powered by trusted local data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "openai-agents>=0.22.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
aug9 = "aug9.cli:main"
aug9-import-nea-hawkers = "aug9.discovery.import_nea_hawkers:main"
aug9-import-food-statistics = "aug9.discovery.import_food_establishment_statistics:main"
aug9-import-food-profiles = "aug9.discovery.import_food_profiles:main"
aug9-import-food-evidence = "aug9.discovery.import_food_evidence:main"
aug9-match-michelin-pilot = "aug9.discovery.match_michelin_pilot:main"
aug9-import-michelin-evidence = "aug9.discovery.import_michelin_evidence:main"
aug9-import-sfa-food-establishments = "aug9.discovery.import_sfa_food_establishments:main"
aug9-enrich-food-locations = "aug9.discovery.enrich_food_locations:main"
aug9-stage-food-candidates = "aug9.discovery.import_food_candidates:main"
aug9-import-hlb-hotels = "aug9.discovery.import_hlb_hotels:main"
aug9-enrich-hotel-addresses = "aug9.discovery.enrich_hotel_addresses:main"
aug9-report-product-analytics = "aug9.core.report_product_analytics:main"
aug9-archive-expired-events = "aug9.discovery.archive_expired_events:main"
aug9-import-public-events = "aug9.discovery.import_public_events:main"
aug9-refresh-events = "aug9.discovery.refresh_events:main"
aug9-report-event-catalog = "aug9.discovery.report_event_catalog:main"
aug9-report-food-catalog = "aug9.discovery.report_food_catalog:main"
aug9-report-food-evidence = "aug9.discovery.report_food_evidence:main"
aug9-link-google-food-places = "aug9.discovery.link_google_food_places:main"
aug9-report-google-rating-gate = "aug9.discovery.report_google_rating_gate:main"
aug9-evaluate-food-ranking = "aug9.discovery.evaluate_food_ranking:main"
aug9-report-food-ranking-shadow = "aug9.discovery.report_food_ranking_shadow:main"
aug9-report-service-catalog = "aug9.sg_services.report_service_catalog:main"
aug9-enrich-event-venues = "aug9.discovery.enrich_event_venues:main"
aug9-import-playgrounds = "aug9.discovery.import_playgrounds:main"
aug9-import-food-domain = "aug9.discovery.import_food_domain:main"
aug9-prepare-google-takeout-food = "aug9.discovery.prepare_google_takeout_food:main"
aug9-match-food-domain = "aug9.discovery.match_food_domain:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services or LLMs",
]
