[project]
name = "aug9"
version = "0.1.0"
description = "Open-source Singapore personal agent powered by trusted local data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "openai-agents>=0.22.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
aug9 = "aug9.cli:main"
aug9-import-nea-hawkers = "aug9.discovery.import_nea_hawkers:main"
aug9-import-food-statistics = "aug9.discovery.import_food_establishment_statistics:main"
aug9-import-hlb-hotels = "aug9.discovery.import_hlb_hotels:main"
aug9-enrich-hotel-addresses = "aug9.discovery.enrich_hotel_addresses:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services or LLMs",
]
