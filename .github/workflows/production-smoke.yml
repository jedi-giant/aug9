name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run aug9-smoke-production
